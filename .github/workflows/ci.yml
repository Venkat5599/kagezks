name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  contract-tests:
    name: Contract Tests (Soroban)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup update stable && rustup target add wasm32-unknown-unknown
      - name: Run veil pool tests
        working-directory: contracts/solvency
        run: cargo test -p veil
      - name: Run session account tests
        working-directory: contracts/solvency
        run: cargo test -p session_account

  frontend-build:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: TypeCheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npm run build

  record-deployment:
    # The app is served from a VPS (pm2 + nginx, see deploy/README.md), so this job
    # does not perform the deploy itself. It records the environment against the
    # commit once tests and the build pass, which is what surfaces the live URL in
    # the repository's Environments panel and the deployment history.
    name: Record Production Environment
    needs: [contract-tests, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://kageai.me
    steps:
      - name: Verify the live app is reachable
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://kageai.me)
          echo "kageai.me returned HTTP $code"
          test "$code" = "200"
